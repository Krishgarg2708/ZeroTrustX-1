<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroTrustX - Zero Trust Network Access & Identity Security Platform</title>
    <meta name="description" content="Production-grade Zero Trust Network Access (ZTNA) & Identity Security Platform. Continuous verification, adaptive risk scoring, device trust, MFA, and automated access governance." />
    <meta property="og:title" content="ZeroTrustX - Zero Trust Network Access & Identity Security Platform" />
    <meta property="og:description" content="Production-grade Zero Trust Network Access (ZTNA) & Identity Security Platform. Continuous verification, adaptive risk scoring, device trust, MFA, and automated access governance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script>
      // Applied before React mounts so a light-theme user never gets a flash
      // of the dark palette. Mirrors the defaults in UiContext.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('ztx.ui.v1') || '{}');
          var choice = s.theme || 'dark';
          var dark =
            choice === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : choice !== 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          if (s.density) root.setAttribute('data-density', s.density);
          if (s.grainEnabled !== false) document.body && document.body.classList.add('grain');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
